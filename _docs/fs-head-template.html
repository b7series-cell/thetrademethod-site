<style>
  :root {
    --bg:#070d17; --panel:#0c1626; --panel2:#101d2f; --line:#1b2a3e;
    --ink:#e7eff8; --dim:#9fb3c8; --faint:#6d84a0;
    --up:#2ecf7a; --down:#e0505a; --gold:#f4b942; --blue:#5aa9ff;
    --sans:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--sans); font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .sheet { max-width:1640px; margin:0 auto; padding:34px 30px 56px; }

  /* ---------- header ---------- */
  .top { display:grid; grid-template-columns:minmax(320px,1fr) minmax(340px,1.15fr); gap:34px; align-items:end;
         border-bottom:1px solid var(--line); padding-bottom:26px; }
  h1 { font-size:clamp(38px,5.6vw,66px); line-height:0.98; letter-spacing:-0.03em; font-weight:800; margin:0 0 10px; }
  h1 span { color:var(--up); }
  .kicker { color:var(--faint); font-size:14px; margin:0 0 14px; }
  .thesis { font-size:19px; line-height:1.45; color:var(--ink); margin:0; max-width:62ch; }
  .thesis em { font-style:normal; color:var(--up); font-weight:700; }
  .counts { display:flex; gap:26px; margin-top:16px; }
  .counts div { border-left:2px solid var(--up); padding-left:12px; }
  .counts b { display:block; font-size:26px; font-weight:800; letter-spacing:-0.02em; }
  .counts small { color:var(--faint); font-size:13px; }
  .back { display:inline-block; margin-bottom:18px; font-size:13px; color:var(--faint); text-decoration:none; border-bottom:1px solid transparent; }
  .back:hover { color:var(--ink); border-bottom-color:var(--faint); }

  /* ---------- ribbon ---------- */
  .ribbon { display:grid; grid-template-columns:repeat(5,1fr); gap:2px; margin:26px 0 30px;
            background:var(--line); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .ribbon div { background:var(--panel); padding:13px 16px; }
  .ribbon .t { font-family:var(--mono); font-size:12px; color:var(--gold); }
  .ribbon .n { font-weight:700; font-size:15px; margin-top:3px; }

  /* ---------- main ---------- */
  .main { display:grid; grid-template-columns:minmax(300px,0.62fr) minmax(520px,1.38fr); gap:28px; align-items:start; }
  .stage { border-top:1px solid var(--line); padding:16px 0 15px; display:grid;
           grid-template-columns:34px 1fr; gap:14px; }
  .stage:first-child { border-top:none; padding-top:0; }
  .num { font-family:var(--mono); font-size:14px; font-weight:700; color:#08131f;
         background:var(--up); border-radius:6px; height:26px; display:flex; align-items:center;
         justify-content:center; }
  .stage h3 { margin:2px 0 7px; font-size:19px; letter-spacing:-0.01em; }
  .stage ul { margin:0; padding-left:17px; }
  .stage li { margin-bottom:4px; color:var(--ink); }
  .why { color:var(--dim); font-size:13.5px; margin:9px 0 0; padding-left:12px;
         border-left:2px solid #24384f; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .panel + .panel { margin-top:22px; }
  .panel h4 { margin:0 0 4px; font-size:17px; }
  .panel p.lead { margin:0 0 14px; color:var(--dim); font-size:14px; }
  svg { display:block; width:100%; height:auto; }

  /* ---------- timing ---------- */
  .timing { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:14px; }
  .timing div { background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:13px 15px; }
  .timing b { display:block; font-size:15px; margin-bottom:4px; }
  .timing p { margin:0; color:var(--dim); font-size:13.4px; }

  /* ---------- filters (reused as gut-check cards) ---------- */
  .section-head { margin:44px 0 16px; padding-top:22px; border-top:1px solid var(--line); }
  .section-head h2 { margin:0 0 5px; font-size:26px; letter-spacing:-0.02em; }
  .section-head p { margin:0; color:var(--dim); max-width:78ch; }
  .filters { display:grid; grid-template-columns:repeat(5,1fr); gap:16px; }
  .filter { background:var(--panel); border:1px solid var(--line); border-top:3px solid var(--down);
            border-radius:11px; padding:16px 17px; }
  .filter h3 { margin:0 0 8px; font-size:17px; }
  .filter p { margin:0 0 9px; font-size:14px; color:var(--ink); }
  .filter .kill { color:var(--down); font-size:13.2px; margin:0; font-weight:600; }

  /* ---------- examples ---------- */
  table { width:100%; border-collapse:collapse; font-size:14px; }
  caption { text-align:left; color:var(--dim); padding-bottom:10px; }
  th, td { padding:10px 12px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top; }
  thead th { color:var(--faint); font-weight:600; font-size:13px; border-bottom:1px solid #2b4058; }
  tbody th { font-weight:600; color:var(--dim); width:170px; }
  td { font-family:var(--mono); font-size:13.6px; }
  td.txt { font-family:var(--sans); font-size:14px; }
  .tick { font-family:var(--sans); font-size:17px; font-weight:800; letter-spacing:-0.01em; }
  .tick small { display:block; font-weight:400; font-size:12.5px; color:var(--faint); letter-spacing:0; }
  .pos { color:var(--up); } .neg { color:var(--down); }

  /* ---------- footer ---------- */
  .rule { margin-top:44px; border:1px solid #22855a; background:#0b1c17; border-radius:12px;
          padding:26px 30px; display:grid; grid-template-columns:1.25fr 1fr; gap:30px; }
  .rule h2 { margin:0 0 8px; font-size:30px; line-height:1.15; letter-spacing:-0.02em; }
  .rule p { margin:0; color:var(--dim); }
  .rule ul { margin:0; padding-left:18px; color:var(--dim); font-size:14px; }
  .src { margin-top:26px; color:var(--faint); font-size:12.5px; }

  @media (max-width:1100px) {
    .top,.main,.rule { grid-template-columns:1fr; }
    .ribbon, .ribbon.seven { grid-template-columns:repeat(2,1fr); }
    .ribbon.seven > div:last-child { grid-column:span 2; }
    .filters { grid-template-columns:repeat(2,1fr); }
    .timing { grid-template-columns:1fr; }
  }
  @media print {
    body { background:#fff; }
    .sheet { max-width:none; padding:0; }
    .panel,.filter,.rule,.stage,table { break-inside:avoid; }
    @page { size:A3 landscape; margin:12mm; }
  }
</style>

<style>
  /* ---------- page-only rules (after apple.css so they win) ---------- */
  .calc .row { display:flex; justify-content:space-between; align-items:baseline; gap:16px; padding:10px 0; font-size:15px; }
  .calc .row span { color:var(--mute); }
  .calc .row b { font-family:var(--mono-font); font-weight:600; text-align:right; }
  .calc .row.tot b { color:var(--up); }
  .panel ul.plain { margin:0; padding-left:18px; color:var(--silk); font-size:14.5px; }
  .panel ul.plain li { margin-bottom:6px; }
  .panel a.more { font-size:15px; }

  /* video */
  .video { background:var(--charcoal); border-radius:28px; padding:24px; margin:72px 0 0;
           display:grid; grid-template-columns:minmax(0,1.6fr) minmax(240px,1fr); gap:28px; align-items:center; }
  .video-frame { position:relative; aspect-ratio:16/9; border-radius:18px; overflow:hidden; background:#000; }
  .video-frame iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .video h2 { margin:0 0 8px; font-size:28px; font-weight:600; line-height:1.14; }
  .video p { margin:0 0 14px; color:var(--mute); }
  .video ol { margin:0 0 16px; padding-left:20px; color:var(--mute); font-size:15px; }
  .video ol li { margin-bottom:4px; }
  .video ol b { font-family:var(--mono-font); font-weight:500; color:var(--ash); font-size:13px; margin-right:6px; }
  .video a.more { font-size:15px; }

  /* two- and three-way comparisons */
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px; }
  .pair div { background:var(--raised); border-radius:18px; padding:14px 16px; }
  .pair .k { font-size:12px; color:var(--ash); font-family:var(--mono-font); }
  .pair b { display:block; margin:6px 0 4px; font-size:16px; }
  .pair p { margin:0; color:var(--mute); font-size:14px; }
  .pair .yes { background:rgba(48,209,88,0.12); } .pair .yes b { color:var(--up); }
  .pair .care { background:rgba(255,159,10,0.12); } .pair .care b { color:var(--orange); }

  /* card grids */
  .four { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
  .four.six { grid-template-columns:repeat(3,1fr); }
  .four > div, .four > a { background:var(--charcoal); border-radius:22px; padding:18px 18px 20px; border-top:3px solid var(--tc, var(--up)); color:inherit; text-decoration:none; display:block; }
  .four > a:hover h3 { text-decoration:underline; }
  .four .k { font-family:var(--mono-font); font-size:12px; color:var(--tc, var(--up)); }
  .four h3 { margin:6px 0 8px; font-size:20px; }
  .four p { margin:0 0 6px; color:var(--silk); font-size:15px; }
  .four small { display:block; color:var(--ash); font-size:13.5px; }

  /* a pulled quote from the video */
  .qb { margin:0; padding:18px 20px; background:var(--raised); border-radius:18px; color:var(--silk); font-size:16px; line-height:1.5; }
  .qb b { color:var(--up); }

  /* the animations redraw for a phone, so no sideways scrolling */
  .sheet .anim svg { min-width:0; }
  .sheet .anim { margin:0 0 56px; }
  .section-head + .anim { margin-top:8px; }

  /* the pyramid: five cards, or a stepper once js/pyr-anim.js runs */
  .fs-steps { display:grid; grid-template-columns:repeat(5,1fr); gap:14px; }
  .sheet .fs-steps .stage, .sheet .fs-steps .stage:first-child { padding:22px 20px; background:var(--charcoal); border-radius:22px; align-content:start; }
  .fs-steps.is-stepper { display:block; background:var(--charcoal); border-radius:28px; padding:28px 28px 30px; --gs:#2997ff; }
  .gs-bar { display:grid; grid-template-columns:repeat(5,1fr); position:relative; margin:0 0 28px; }
  .gs-line { position:absolute; left:10%; right:10%; top:21px; height:2px; background:#3a3a3c; }
  .gs-line i { display:block; height:100%; width:0; background:var(--up); transition:width .35s ease; }
  .gs-step { position:relative; background:none; border:0; padding:0; color:var(--ash,#86868b); font:inherit; font-size:14px; cursor:pointer; text-align:center; }
  .gs-step b { display:flex; align-items:center; justify-content:center; width:44px; height:44px; margin:0 auto 8px; border-radius:50%;
               background:#2c2c2e; border:2px solid #2c2c2e; color:#f5f5f7; font-size:17px; position:relative; z-index:1; transition:all .25s ease; }
  .gs-step.is-done b { background:#123d22; border-color:var(--up); color:var(--up); }
  .gs-step.is-on b { background:var(--gs); border-color:var(--gs); color:#000; box-shadow:0 0 0 6px color-mix(in srgb, var(--gs) 22%, transparent); }
  .gs-step.is-on { color:#f5f5f7; font-weight:600; }
  .gs-step:focus-visible b { outline:2px solid #2997ff; outline-offset:3px; }
  .gs-body { display:grid; grid-template-columns:1fr 1.1fr; gap:30px; align-items:center; }
  .gs-tag { margin:0 0 4px; font-family:var(--mono); font-size:12px; color:var(--gs); letter-spacing:0.04em; text-transform:uppercase; }
  .sheet .fs-steps.is-stepper .stage, .sheet .fs-steps.is-stepper .stage:first-child { background:none; padding:0; border:0; margin:0; border-radius:0; }
  .sheet .fs-steps.is-stepper .stage .num { display:none; }
  .sheet .fs-steps.is-stepper .stage[hidden] { display:none; }
  .sheet .fs-steps.is-stepper .stage .why { border-left-color:var(--gs); }
  .gs-nav { display:flex; gap:10px; margin-top:20px; }
  .gs-prev { background:#2c2c2e; color:#f5f5f7; }
  .gs-prev:hover { background:#3a3a3c; }
  .gs-nav button:disabled { opacity:0.35; cursor:default; }
  .gs-chart { background:#141416; border-radius:18px; padding:10px; }
  .fs-steps + .four { margin-top:28px; }
  .fs-steps + .section-head { margin-top:56px; }

  @media (max-width:1100px) {
    .video { grid-template-columns:1fr; }
    .four, .four.six { grid-template-columns:repeat(2,1fr); }
    .fs-steps { grid-template-columns:1fr 1fr; }
  }
  @media (max-width:900px) {
    .gs-body { grid-template-columns:1fr; gap:20px; }
    .gs-chart { order:-1; }
  }
  @media (max-width:680px) {
    /* breathing room around each walkthrough on small screens */
    .sheet .anim { margin:44px 0 60px; padding:22px 14px 20px; }
    .section-head + .anim { margin-top:24px; }
    .sheet .anim + .main, .sheet .anim + .four { margin-top:8px; }
    .sheet .main + .anim, .sheet .four + .anim { margin-top:56px; }
    .sheet .anim + .section-head { margin-top:8px; }
    .anim-head { margin-bottom:18px; }
    .anim-chips { flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:4px; scrollbar-width:none; }
    .anim-chips::-webkit-scrollbar { display:none; }
    .anim-chips button { flex:0 0 auto; }
    .video { padding:14px; border-radius:22px; margin-top:56px; gap:20px; }
    .video h2 { font-size:22px; }
    .four, .four.six, .pair, .fs-steps { grid-template-columns:1fr; }
    .calc .row { flex-direction:column; gap:2px; }
    .calc .row b { text-align:left; }
    .fs-steps.is-stepper { padding:20px 14px 22px; border-radius:22px; }
    .gs-step span { display:none; }
    .gs-step b { width:36px; height:36px; font-size:15px; }
    .gs-line { top:17px; }
    .gs-bar { margin-bottom:20px; }
    .sheet .section-head + .fs-steps { margin-top:24px; }
  }

  /* fact sheet, timeline, sources */
  .facts { display:grid; grid-template-columns:repeat(4,1fr); gap:2px; background:var(--graphite); border-radius:22px; overflow:hidden; margin-top:26px; }
  .facts div { background:var(--charcoal); padding:16px 18px; }
  .facts .k { font-family:var(--mono-font); font-size:12px; color:var(--ash); }
  .facts b { display:block; margin-top:4px; font-size:16px; font-weight:600; line-height:1.3; }
  .tl { list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(6,1fr); gap:14px; }
  .tl li { background:var(--charcoal); border-radius:20px; padding:16px 16px 18px; border-top:3px solid var(--tc, var(--up)); }
  .tl .y { font-family:var(--mono-font); font-size:13px; color:var(--tc, var(--up)); font-weight:600; }
  .tl b { display:block; margin:6px 0 6px; font-size:16px; line-height:1.25; }
  .tl p { margin:0; color:var(--mute); font-size:14px; }
  .cites { margin:0; padding-left:20px; color:var(--silk); font-size:15px; }
  .cites li { margin-bottom:10px; }
  .cites i { color:var(--platinum); }
  .cites small { display:block; color:var(--ash); font-size:13.5px; margin-top:2px; }
  @media (max-width:1100px) { .facts { grid-template-columns:repeat(2,1fr); } .tl { grid-template-columns:repeat(3,1fr); } }
  @media (max-width:680px) { .facts, .tl { grid-template-columns:1fr; } .sheet .section-head + .fs-steps { margin-top:24px; } }

  /* the indicator */
  .ind-heading { margin:0 0 5px; font-size:26px; letter-spacing:-0.02em; }
  .ind-wrap { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.15fr); gap:22px; align-items:start; }

  .howto { margin:0; padding-left:20px; color:var(--silk); font-size:15px; }
  .howto li { margin-bottom:9px; }
  .howto b { color:#f4b942; font-weight:600; }
  .code-wrap { background:var(--charcoal); border-radius:22px; margin-top:22px; overflow:hidden; }
  .code-top { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid #2c2c2e; flex-wrap:wrap; }
