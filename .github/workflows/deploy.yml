# Deploys the site to SiteGround (thetrademethod.com) on every push to main.
#
# Upload-only: files are added or overwritten, nothing on the server is
# deleted. Server-only files (api/config.php, api/cache/, .well-known/) are
# never touched. Remove a page from the server by hand if one is retired.
#
# Repo secrets it needs (Settings > Secrets and variables > Actions):
#   SG_HOST            SSH hostname from SiteGround (Devs > SSH Keys Manager > Actions > SSH credentials)
#   SG_USER            SSH username from the same screen (looks like u123-abc...)
#   SG_SSH_KEY         the private key, whole text including the BEGIN/END lines
#   SG_SSH_PASSPHRASE  the password you set when SiteGround made the key

name: Deploy to SiteGround

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list what would upload, change nothing"
        type: boolean
        default: false
      indexnow_all:
        description: "Also send every sitemap URL to IndexNow (Bing, Yandex and others)"
        type: boolean
        default: false

concurrency:
  group: deploy-siteground
  cancel-in-progress: false

jobs:
  # Stops the deploy if a sitemap page is missing its title, description,
  # canonical or JSON-LD, is marked noindex, or links to a file that doesn't
  # exist. Long titles/descriptions and llms.txt gaps are warnings only.
  seo-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check SEO basics
        run: python3 _docs/seo-check.py

  deploy:
    needs: seo-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SG_PORT: "18765"
      SG_PATH: "www/thetrademethod.com/public_html/"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up SSH key
        env:
          SG_SSH_KEY: ${{ secrets.SG_SSH_KEY }}
          SG_SSH_PASSPHRASE: ${{ secrets.SG_SSH_PASSPHRASE }}
          SG_HOST: ${{ secrets.SG_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SG_SSH_KEY" | tr -d '\r' > ~/.ssh/sg_key
          chmod 600 ~/.ssh/sg_key
          # SiteGround keys carry a password; strip it from the runner's copy only.
          if [ -n "$SG_SSH_PASSPHRASE" ]; then
            ssh-keygen -p -P "$SG_SSH_PASSPHRASE" -N "" -f ~/.ssh/sg_key >/dev/null
          fi
          ssh-keyscan -p "$SG_PORT" -H "$SG_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload changed files
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_USER: ${{ secrets.SG_USER }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          rsync -rlptvz --checksum --itemize-changes $DRY \
            --chmod=D755,F644 \
            --exclude='.git/' --exclude='.github/' --exclude='.gitignore' \
            --exclude='_docs/' --exclude='DEPLOY.md' \
            --exclude='api/config.php' --exclude='api/cache/' \
            --exclude='.well-known/' \
            -e "ssh -i ~/.ssh/sg_key -p $SG_PORT -o IdentitiesOnly=yes" \
            ./ "$SG_USER@$SG_HOST:$SG_PATH"

      - name: Flush SiteGround cache
        if: ${{ !inputs.dry_run }}
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_USER: ${{ secrets.SG_USER }}
        run: |
          ssh -i ~/.ssh/sg_key -p "$SG_PORT" -o IdentitiesOnly=yes "$SG_USER@$SG_HOST" \
            'site-tools-client domain update id=1 flush_cache=1 || site-tools-client domain-all update id=1 flush_cache=1' \
            || echo "::warning::Cache flush did not run; clear it in Site Tools > Speed > Caching if a change doesn't show."

      # IndexNow (Bing, Yandex, Seznam, Naver): tell search engines which pages
      # changed in this push. Only URLs that are in sitemap.xml are sent, so
      # noindex pages never go out. The key file lives at the site root.
      - name: Ping IndexNow
        if: ${{ !inputs.dry_run }}
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          ALL: ${{ inputs.indexnow_all && '1' || '' }}
        run: |
          python3 - <<'PY' || echo "::warning::IndexNow ping failed; the deploy itself is fine."
          import json, os, re, subprocess, urllib.request
          HOST = "thetrademethod.com"
          KEY = "9c654478e9cc4485b6780bd293f209d7"
          sitemap = re.findall(r"<loc>([^<]+)</loc>", open("sitemap.xml", encoding="utf-8").read())
          if os.environ.get("ALL"):
              urls = sitemap
          else:
              before, after = os.environ.get("BEFORE", ""), os.environ["AFTER"]
              if not before or set(before) == {"0"}:
                  print("No previous commit to compare; nothing sent."); raise SystemExit(0)
              changed = subprocess.run(["git", "diff", "--name-only", before, after],
                                       capture_output=True, text=True, check=True).stdout.split()
              want = set()
              for f in changed:
                  if not f.endswith(".html"):
                      continue
                  path = f[:-len("index.html")] if f.endswith("index.html") else f
                  want.add(f"https://{HOST}/{path}")
              urls = [u for u in sitemap if u in want]
          if not urls:
              print("No sitemap pages changed; nothing sent."); raise SystemExit(0)
          body = json.dumps({"host": HOST, "key": KEY,
                             "keyLocation": f"https://{HOST}/{KEY}.txt", "urlList": urls[:10000]}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          with urllib.request.urlopen(req, timeout=30) as r:
              print(f"IndexNow: HTTP {r.status} for {len(urls)} URL(s)")
          for u in urls:
              print("  " + u)
          PY
