<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're offline — The Trade Method</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<!-- Self-contained on purpose: this page is shown when nothing else can
     load, so it must not depend on apple.css, nav.js or web fonts. -->
<style>
  :root { --black:#000; --panel:#1d1d1f; --line:#2c2c2e; --silk:#f5f5f7; --dim:#a1a1a6; --buy:#0071e3; --link:#2997ff; --up:#30d158; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--black); color:var(--silk); }
  body { font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,"Helvetica Neue",Arial,sans-serif;
         font-size:17px; line-height:1.47; letter-spacing:-0.022em; -webkit-font-smoothing:antialiased;
         min-height:100vh; display:flex; flex-direction:column; }
  a { color:inherit; text-decoration:none; }
  .bar { height:44px; display:flex; align-items:center; justify-content:center; border-bottom:1px solid var(--line); }
  .bar svg { width:20px; height:20px; }
  main { flex:1; width:100%; max-width:680px; margin:0 auto; padding:72px 16px 64px; text-align:center; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#ff9f0a; margin-right:8px; vertical-align:middle; }
  .eyebrow { color:var(--dim); font-size:14px; letter-spacing:0; }
  h1 { font-size:clamp(36px, 8vw, 56px); line-height:1.07; letter-spacing:-0.015em; font-weight:600; margin:12px 0 16px; }
  p.lede { color:var(--dim); font-size:19px; margin:0 auto 32px; max-width:30em; }
  .pills { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; }
  .pill { display:inline-flex; align-items:center; border-radius:9999px; padding:11px 22px; font-size:17px; border:0; cursor:pointer; font:inherit; }
  .pill-buy { background:var(--buy); color:#fff; }
  .pill-buy:hover { background:#0077ed; }
  .pill-alt { background:transparent; color:var(--silk); box-shadow:inset 0 0 0 1px rgba(245,245,247,0.45); }
  .saved { margin-top:56px; text-align:left; }
  .saved h2 { font-size:21px; font-weight:600; margin:0 0 4px; }
  .saved .note { color:var(--dim); font-size:15px; margin:0 0 16px; }
  .saved ul { list-style:none; margin:0; padding:0; border-top:1px solid var(--line); }
  .saved li a { display:flex; justify-content:space-between; gap:12px; padding:14px 4px; border-bottom:1px solid var(--line); }
  .saved li a:hover { color:var(--link); }
  .saved li span { color:var(--dim); font-size:14px; white-space:nowrap; }
  :focus-visible { outline:2px solid var(--link); outline-offset:3px; border-radius:10px; }
</style>
</head>
<body>

<div class="bar" aria-hidden="true">
  <svg viewBox="0 0 32 32"><rect x="7" y="7" width="2" height="18" fill="#f5f5f7"/><rect x="5" y="11" width="6" height="9" rx="1.5" fill="#f5f5f7"/><rect x="15" y="5" width="2" height="17" fill="#f5f5f7"/><rect x="13" y="9" width="6" height="8" rx="1.5" fill="#f5f5f7"/><rect x="23" y="10" width="2" height="17" fill="#f5f5f7"/><rect x="21" y="14" width="6" height="9" rx="1.5" fill="#f5f5f7"/></svg>
</div>

<main>
  <div class="eyebrow"><span class="dot"></span>No connection</div>
  <h1>You're offline.</h1>
  <p class="lede">This page hasn't been saved on this device yet. Pages you've already opened still work, and live charts come back as soon as you're online again.</p>
  <div class="pills">
    <button type="button" class="pill pill-buy" id="retry">Try again</button>
    <a class="pill pill-alt" href="/">Home</a>
  </div>

  <section class="saved" id="saved" hidden>
    <h2>Saved on this device</h2>
    <p class="note">These open without a connection.</p>
    <ul id="saved-list"></ul>
  </section>
</main>

<script>
  document.getElementById("retry").addEventListener("click", function () { location.reload(); });
  window.addEventListener("online", function () { location.reload(); });

  /* List the pages the service worker has saved, so there's somewhere to go. */
  (function () {
    if (!("caches" in window)) return;
    function isPage(p) { return p !== "/offline.html" && (p === "/" || /\/$|\.html$/.test(p)); }
    function titleOf(res, path) {
      return res.text().then(function (html) {
        var m = html.match(/<title>([^<]*)<\/title>/i);
        var t = m ? m[1].split(/\s+[|\u2014]\s+/)[0].trim() : "";
        return t || path;
      });
    }
    caches.keys().then(function (names) {
      return Promise.all(names.filter(function (n) { return n.indexOf("ttm-") === 0; }).map(function (n) {
        return caches.open(n).then(function (c) {
          return c.keys().then(function (reqs) {
            return Promise.all(reqs.filter(function (r) { return isPage(new URL(r.url).pathname); }).map(function (r) {
              var path = new URL(r.url).pathname;
              return c.match(r).then(function (res) { return titleOf(res, path); })
                .then(function (t) { return { path: path, title: t }; });
            }));
          });
        });
      }));
    }).then(function (lists) {
      var seen = {}, pages = [];
      [].concat.apply([], lists).forEach(function (pg) { if (!seen[pg.path]) { seen[pg.path] = true; pages.push(pg); } });
      if (!pages.length) return;
      pages.sort(function (a, b) { return a.path === "/" ? -1 : b.path === "/" ? 1 : a.title.localeCompare(b.title); });
      var ul = document.getElementById("saved-list");
      pages.forEach(function (pg) {
        var li = document.createElement("li"), a = document.createElement("a"), s = document.createElement("span");
        a.href = pg.path; a.textContent = pg.path === "/" ? "Home" : pg.title;
        s.textContent = pg.path.indexOf("/setups/") === 0 && pg.path !== "/setups/" ? "Setup" : "";
        a.appendChild(s); li.appendChild(a); ul.appendChild(li);
      });
      document.getElementById("saved").hidden = false;
    }).catch(function () {});
  })();
</script>
</body>
</html>
